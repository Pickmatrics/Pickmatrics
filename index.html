<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickMatrics – AI Analyzer for Prediction Markets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .grid-pattern {
      background-image: radial-gradient(rgba(16, 185, 129, 0.2) 1px, transparent 1px);
      background-size: 10px 10px;
    }

    @keyframes shakeAnimation {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px) rotate(-0.5deg); }
      40%, 80% { transform: translateX(4px) rotate(0.5deg); }
    }

    .animate-shake {
      animation: shakeAnimation 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans antialiased relative">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [currentView, setCurrentView] = useState("landing");
      const [user, setUser] = useState(null);
      const [apiKey, setApiKey] = useState("");
      const [apiKeyInput, setApiKeyInput] = useState("");
      const [imagePreview, setImagePreview] = useState(null);
      const [uploadedMimeType, setUploadedMimeType] = useState("image/jpeg");
      const [base64Raw, setBase64Raw] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);

      const handleDummyLogin = () => {
        setUser({
          name: "Demo User",
          email: "demo@pickmatrics.ai",
          picture: "https://api.dicebear.com/7.x/avataaars/svg?seed=PickMatrics"
        });
        setCurrentView("app");
      };

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const isImage = file.type.startsWith("image/");
        if (!isImage) {
          alert("Please upload a valid image file.");
          return;
        }

        const reader = new FileReader();
        reader.onloadend = () => {
          const rawDataUrl = reader.result;
          setImagePreview(rawDataUrl);
          setUploadedMimeType(file.type || "image/jpeg");
          setBase64Raw(rawDataUrl.split(",")[1]);
        };
        reader.readAsDataURL(file);
      };

      const analyzeWithGemini = async () => {
        if (!base64Raw) {
          alert("Please upload a market screenshot first.");
          return;
        }

        if (!apiKey.trim()) {
          alert("Please add your Gemini API key before analyzing a market.");
          return;
        }

        setLoading(true);
        setResult(null);

        try {
          const key = apiKey.trim();
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`;
          const prompt = `Analyze this sports betting screenshot. Respond with valid JSON only in this exact structure:
          {
            "recommendation": "Bet [Team/Market] [YES/NO/OVER/UNDER]",
            "reasoningSummary": "Short high-level summary",
            "confidenceScore": "85%",
            "keyAnalysisPoints": ["point 1", "point 2"],
            "risksToWatch": ["risk 1"]
          }`;

          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: uploadedMimeType, data: base64Raw } }
                ]
              }],
              generationConfig: { response_mime_type: "application/json" }
            })
          });

          const data = await response.json();

          if (!response.ok || data.error) {
            throw new Error(data?.error?.message || "Failed to reach the Gemini API.");
          }

          const text = data.candidates?.[0]?.content?.parts
            ?.map((part) => part.text || "")
            .join("") || "";

          if (!text) {
            throw new Error("The API returned an empty response.");
          }

          let parsed;
          try {
            parsed = JSON.parse(text);
          } catch {
            const match = text.match(/\{[\s\S]*\}/);
            if (!match) throw new Error("The model response was not valid JSON.");
            parsed = JSON.parse(match[0]);
          }

          if (!parsed.recommendation || !parsed.reasoningSummary) {
            throw new Error("The response did not contain a valid recommendation.");
          }

          setResult(parsed);
        } catch (err) {
          alert("Error analyzing image: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleGetStartedClick = () => {
        if (user) {
          setCurrentView("app");
        } else {
          setCurrentView("auth");
        }
      };

      const AppLogo = () => (
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center p-1.5 shadow-lg shadow-emerald-500/20">
            <svg viewBox="0 0 100 100" className="w-full h-full stroke-slate-950 fill-none" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round">
              <path d="M 26 22 H 16 V 78 H 26" />
              <path d="M 74 22 H 84 V 78 H 74" />
              <path d="M 36 64 L 64 36 M 46 36 H 64 V 54" />
            </svg>
          </div>
          <span className="font-extrabold text-xl tracking-tight text-white">PickMatrics</span>
        </div>
      );

      if (currentView === "landing") {
        return (
          <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-emerald-950 text-white flex flex-col items-center relative">
            <div className="w-full bg-emerald-950/80 text-emerald-200 text-[11px] font-medium py-2 px-4 flex justify-between items-center max-w-md border-b border-emerald-800/40">
              <span className="mx-auto">Free tier active. Try your first analysis today!</span>
              <span className="cursor-pointer opacity-70 hover:opacity-100">&times;</span>
            </div>

            <div className="w-full max-w-md p-4 space-y-6 pb-24">
              <header className="flex justify-between items-center py-2">
                <AppLogo />
                {user ? (
                  <div className="flex items-center gap-2">
                    <img src={user.picture} alt={user.name} className="w-8 h-8 rounded-full border border-emerald-500" />
                    <button
                      onClick={() => setCurrentView("app")}
                      className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-xl transition"
                    >
                      Dashboard &rarr;
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setCurrentView("auth")}
                    className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg transition animate-shake"
                  >
                    Start for FREE
                  </button>
                )}
              </header>

              <section className="text-center space-y-4 pt-2">
                <div className="inline-flex items-center gap-2 bg-emerald-950/60 border border-emerald-500/30 px-3.5 py-1.5 rounded-full text-xs text-emerald-200 backdrop-blur-sm">
                  <span className="font-bold text-emerald-400">$8,341,005+</span> won by people like you
                  <svg className="w-3.5 h-3.5 text-emerald-400 fill-current" viewBox="0 0 20 20">
                    <path d="M10 0C4.48 0 0 4.48 0 10s4.48 10 10 10 10-4.48 10-10S15.52 0 10 0zm-1 15l-5-5 1.41-1.41L9 12.17l7.59-7.59L18 6l-9 9z"/>
                  </svg>
                </div>

                <h1 className="text-4xl font-black tracking-tight leading-tight px-1 text-white">
                  The #1 AI tool to <span className="italic underline decoration-emerald-500">win</span> sports Prediction Markets
                </h1>

                <p className="text-xs text-slate-300/90 leading-relaxed max-w-xs mx-auto">
                  PickMatrics is your all in one platform for making money on prediction markets with the power of AI.
                </p>

                <button
                  onClick={handleGetStartedClick}
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-2xl text-base shadow-xl shadow-emerald-500/20 transition flex items-center justify-center"
                >
                  Get my winning PICK &rarr;
                </button>

                <div className="flex items-center justify-center gap-2 pt-1 text-xs">
                  <div className="flex text-emerald-400 gap-0.5 text-sm">★ ★ ★ ★ ★</div>
                  <span className="font-bold text-white">4.9/5</span>
                  <span className="text-slate-600">|</span>
                  <div className="flex items-center gap-1 text-slate-300 font-medium">
                    <svg className="w-3.5 h-3.5 text-emerald-400 fill-current" viewBox="0 0 20 20">
                      <path d="M10 0C4.48 0 0 4.48 0 10s4.48 10 10 10 10-4.48 10-10S15.52 0 10 0zm-1 15l-5-5 1.41-1.41L9 12.17l7.59-7.59L18 6l-9 9z"/>
                    </svg>
                    <span>verified by Proof</span>
                  </div>
                </div>

                <p className="text-[11px] text-slate-400 max-w-xs mx-auto leading-tight pt-0.5">
                  *Works with Polymarket, Kalshi & more. PickMatrics never touches your money or wallet.
                </p>
              </section>

              <section className="space-y-4 pt-6">
                <div className="bg-slate-900 border border-emerald-500/30 rounded-3xl pt-8 pb-7 px-6 text-center space-y-3 relative overflow-hidden shadow-2xl">
                  <div className="absolute top-0 left-0 right-0 h-16 bg-gradient-to-b from-emerald-500/15 via-emerald-500/5 to-transparent grid-pattern pointer-events-none"></div>
                  <div className="relative z-10 flex flex-col items-center space-y-2.5">
                    <div className="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-xs font-bold px-4 py-1.5 rounded-full shadow-sm">
                      Step 1
                    </div>
                    <h3 className="font-extrabold text-xl text-white tracking-tight">Upload Screenshot</h3>
                    <p className="text-xs text-slate-300 font-medium max-w-xs">Drop a screenshot of any market.</p>
                  </div>
                </div>

                <div className="bg-slate-900 border border-emerald-500/30 rounded-3xl pt-8 pb-7 px-6 text-center space-y-3 relative overflow-hidden shadow-2xl">
                  <div className="absolute top-0 left-0 right-0 h-16 bg-gradient-to-b from-emerald-500/15 via-emerald-500/5 to-transparent grid-pattern pointer-events-none"></div>
                  <div className="relative z-10 flex flex-col items-center space-y-2.5">
                    <div className="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-xs font-bold px-4 py-1.5 rounded-full shadow-sm">
                      Step 2
                    </div>
                    <h3 className="font-extrabold text-xl text-white tracking-tight">AI Analyzes</h3>
                    <p className="text-xs text-slate-300 font-medium max-w-xs">Our AI scans news & data for your edge.</p>
                  </div>
                </div>

                <div className="bg-slate-900 border border-emerald-500/30 rounded-3xl pt-8 pb-7 px-6 text-center space-y-3 relative overflow-hidden shadow-2xl">
                  <div className="absolute top-0 left-0 right-0 h-16 bg-gradient-to-b from-emerald-500/15 via-emerald-500/5 to-transparent grid-pattern pointer-events-none"></div>
                  <div className="relative z-10 flex flex-col items-center space-y-2.5">
                    <div className="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-xs font-bold px-4 py-1.5 rounded-full shadow-sm">
                      Step 3
                    </div>
                    <h3 className="font-extrabold text-xl text-white tracking-tight">Get Your Pick</h3>
                    <p className="text-xs text-slate-300 font-medium max-w-xs">Get a clear pick. Decide your move.</p>
                  </div>
                </div>
              </section>

              <button
                onClick={handleGetStartedClick}
                className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-2xl text-base shadow-xl shadow-emerald-500/20 transition flex items-center justify-center"
              >
                Get my winning PICK &rarr;
              </button>
            </div>

            <div className="fixed bottom-4 left-4 z-50 flex items-center gap-3 bg-slate-900/95 border border-emerald-500/40 backdrop-blur-md p-2.5 pr-4 rounded-2xl shadow-2xl max-w-xs">
              <div className="w-8 h-8 bg-emerald-500 rounded-xl flex items-center justify-center text-slate-950 text-base font-bold shrink-0 shadow-md">
                <svg viewBox="0 0 100 100" className="w-5 h-5 stroke-slate-950 fill-none" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M 26 22 H 16 V 78 H 26" />
                  <path d="M 74 22 H 84 V 78 H 74" />
                  <path d="M 36 64 L 64 36 M 46 36 H 64 V 54" />
                </svg>
              </div>
              <div className="text-[11px] leading-tight space-y-0.5">
                <span className="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-medium block w-fit text-[10px]">
                  Rachel P. from Boston, MA
                </span>
                <p className="text-white font-semibold">
                  Won <span className="text-emerald-400 font-bold">$3,547</span> on their bet
                </p>
                <div className="flex items-center gap-1 text-[9px] text-emerald-400 font-medium">
                  <svg className="w-2.5 h-2.5 fill-current" viewBox="0 0 20 20">
                    <path d="M10 0C4.48 0 0 4.48 0 10s4.48 10 10 10 10-4.48 10-10S15.52 0 10 0zm-1 15l-5-5 1.41-1.41L9 12.17l7.59-7.59L18 6l-9 9z"/>
                  </svg>
                  <span>40 minutes ago • verified by Proof</span>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (currentView === "auth") {
        return (
          <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-emerald-950 text-white flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-sm bg-slate-900/90 rounded-3xl p-6 border border-emerald-500/30 shadow-2xl space-y-6 text-center">
              <div className="flex flex-col items-center space-y-2">
                <AppLogo />
                <h2 className="text-2xl font-black text-white pt-2">Create Account</h2>
                <p className="text-xs text-slate-400">Sign in with Google to unlock AI predictions</p>
              </div>

              <button
                onClick={handleDummyLogin}
                className="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-800 font-semibold py-3 rounded-full transition shadow-sm text-sm"
              >
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" className="w-5 h-5" />
                Sign in with Google (Dummy)
              </button>

              <div className="pt-2">
                <button
                  onClick={() => setCurrentView("landing")}
                  className="text-xs text-slate-400 hover:text-white underline font-medium"
                >
                  &larr; Back to Home
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-emerald-950 text-white flex flex-col items-center p-4">
          <div className="w-full max-w-md space-y-4">
            <header className="flex justify-between items-center py-2 px-1">
              <div className="cursor-pointer" onClick={() => setCurrentView("landing")}>
                <AppLogo />
              </div>

              {user ? (
                <div className="flex items-center gap-2 bg-slate-900 px-3 py-1 rounded-full shadow-sm border border-emerald-500/30">
                  <img src={user.picture} alt={user.name} className="w-6 h-6 rounded-full" />
                  <span className="text-xs font-semibold text-slate-200">{user.name.split(" ")[0]}</span>
                  <button onClick={() => { setUser(null); setCurrentView("landing"); }} className="text-[10px] text-red-400 hover:text-red-300 ml-1">Log out</button>
                </div>
              ) : (
                <button onClick={() => setCurrentView("landing")} className="text-xs text-slate-400 hover:text-white font-medium">
                  &larr; Home
                </button>
              )}
            </header>

            <div className="bg-slate-900/90 rounded-3xl p-6 border border-emerald-500/30 shadow-xl space-y-5">
              <div className="text-center space-y-1">
                <h2 className="text-lg font-bold text-white">Drop a screenshot of any market</h2>
              </div>

              <div className="rounded-2xl border border-emerald-500/30 bg-slate-950/50 p-3">
                <label className="block text-[10px] uppercase tracking-wide text-emerald-300 mb-2">Gemini API key</label>
                <div className="flex gap-2">
                  <input
                    type="password"
                    value={apiKeyInput}
                    onChange={(e) => setApiKeyInput(e.target.value)}
                    placeholder="Paste your Gemini API key"
                    className="w-full rounded-xl border border-slate-700 bg-slate-900 px-3 py-2 text-[11px] text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <button
                    onClick={() => setApiKey(apiKeyInput.trim())}
                    className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-[10px] px-3 py-2 rounded-xl transition"
                  >
                    Save
                  </button>
                </div>
                <p className="text-[10px] text-slate-400 mt-2">Keep your key in the browser for this session only. Do not hardcode it in production.</p>
              </div>

              <label className="border-2 border-dashed border-emerald-500/30 hover:border-emerald-400 bg-slate-950/50 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition">
                {imagePreview ? (
                  <img src={imagePreview} className="max-h-40 rounded-xl object-contain shadow-sm" alt="Uploaded market" />
                ) : (
                  <div className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs shadow-md">
                    Click here to add a market &rarr;
                  </div>
                )}
                <input type="file" accept="image/*" className="hidden" onChange={handleImageChange} />
              </label>

              <button
                onClick={analyzeWithGemini}
                disabled={loading}
                className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3 rounded-2xl text-xs transition shadow-lg shadow-emerald-500/20 disabled:opacity-60"
              >
                {loading ? "Analyzing Market..." : "✨ Find me the best bet"}
              </button>
            </div>

            {result && (
              <div className="bg-slate-900/90 border border-emerald-500/30 rounded-3xl p-5 shadow-xl space-y-4">
                <div className="bg-emerald-950/50 border border-emerald-500/30 p-3.5 rounded-2xl text-center">
                  <span className="text-emerald-300 font-extrabold text-sm block">{result.recommendation}</span>
                  <p className="text-slate-300 text-xs mt-0.5">{result.reasoningSummary}</p>
                </div>

                <div className="flex justify-between items-center bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                  <span className="text-xs text-slate-400 font-medium">Confidence Score</span>
                  <span className="text-xs font-bold text-emerald-400">{result.confidenceScore}</span>
                </div>

                <div className="space-y-3">
                  <div>
                    <p className="text-[10px] uppercase tracking-wide text-slate-400 mb-2">Key analysis points</p>
                    <ul className="space-y-2">
                      {(result.keyAnalysisPoints || []).map((point, index) => (
                        <li key={index} className="flex gap-2 text-xs text-slate-200 bg-slate-800/50 rounded-xl p-2 border border-slate-700/50">
                          <span className="text-emerald-400 font-bold">•</span>
                          <span>{point}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div>
                    <p className="text-[10px] uppercase tracking-wide text-slate-400 mb-2">Risks to watch</p>
                    <ul className="space-y-2">
                      {(result.risksToWatch || []).map((risk, index) => (
                        <li key={index} className="flex gap-2 text-xs text-amber-200 bg-amber-500/10 rounded-xl p-2 border border-amber-500/20">
                          <span className="text-amber-400 font-bold">!</span>
                          <span>{risk}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
